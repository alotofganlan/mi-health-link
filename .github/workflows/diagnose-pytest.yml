name: Diagnose pytest

on:
  push:
    branches:
      - "feat/**"

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Run and publish first error
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          pytest -q 2>&1 | tee /tmp/pytest.out
          rc=${PIPESTATUS[0]}
          detail="$(grep '^E   ' /tmp/pytest.out | head -1 | sed -E 's/^E   //' | tr ' /' '__' | cut -c1-70)"
          if [ -z "$detail" ]; then
            detail="$(grep -E '^(FAILED|ERROR) ' /tmp/pytest.out | head -1 | sed -E 's/^(FAILED|ERROR) //' | tr ' /' '__' | cut -c1-70)"
          fi
          [ -n "$detail" ] || detail="unknown"
          state=success
          [ "$rc" -eq 0 ] || state=failure
          context="xiaomi-sync/diag:$detail"
          payload="$(printf '{\"state\":\"%s\",\"context\":\"%s\",\"description\":\"temporary pytest diagnostic\"}' "$state" "$context")"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "$payload"
          exit "$rc"
