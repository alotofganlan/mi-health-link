[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xiaomi-health-sync"
version = "0.6.0"
description = "Xiaomi Health Cloud auto-discovery and Supabase raw-data sync."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
  "cryptography>=43,<46",
  "mcp>=2.0,<2.1",
  "uvicorn>=0.52,<0.53",
  "PyJWT[crypto]>=2.13,<3",
]

[project.scripts]
xiaomi-health-sync = "xiaomi_health_sync.cli:main"
xiaomi-health-sync-s4 = "xiaomi_health_sync.s4_discover:main"
xiaomi-health-sync-s4-normalize = "xiaomi_health_sync.s4_normalize:main"
xiaomi-health-sync-s4-audit = "xiaomi_health_sync.s4_audit:main"
xiaomi-health-auto-sync = "xiaomi_health_sync.auto_sync:main"
xiaomi-health-nightscout-sync = "xiaomi_health_sync.nightscout_sync:main"
xiaomi-health-blood-glucose = "xiaomi_health_sync.blood_glucose_cli:main"
xiaomi-health-mcp = "xiaomi_health_sync.mcp_server:main"

[tool.setuptools.package-data]
xiaomi_health_sync = ["static/*.html", "static/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "respx>=0.21,<1"]
