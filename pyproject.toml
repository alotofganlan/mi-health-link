[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mi-health-link"
version = "0.6.0"
description = "Xiaomi Health Cloud auto-discovery and Supabase raw-data sync."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
  "cryptography>=43,<46",
  "mcp>=2.0,<2.1",
  "uvicorn>=0.52,<0.53",
  "PyJWT[crypto]>=2.13,<3",
]

[project.scripts]
mi-health-link = "mi_health_link.cli:main"
mi-health-link-s4 = "mi_health_link.s4_discover:main"
mi-health-link-s4-normalize = "mi_health_link.s4_normalize:main"
mi-health-link-s4-audit = "mi_health_link.s4_audit:main"
mi-health-link-auto-sync = "mi_health_link.auto_sync:main"
mi-health-link-nightscout-sync = "mi_health_link.nightscout_sync:main"
mi-health-link-blood-glucose = "mi_health_link.blood_glucose_cli:main"
mi-health-link-mcp = "mi_health_link.mcp_server:main"

[tool.setuptools.package-data]
mi_health_link = ["static/*.html", "static/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "respx>=0.21,<1"]
